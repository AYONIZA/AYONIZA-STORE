<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AYONIZA Admin Orders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4f1;
            color: #222;
        }

        .topbar {
            background: #111;
            color: white;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar h1 {
            margin: 0;
            font-size: 22px;
        }

        .topbar button {
            border: 0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: min(1400px, 95%);
            margin: 25px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #666;
        }

        .stat-card strong {
            font-size: 25px;
        }

        .orders-wrapper {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-id {
            font-size: 18px;
            font-weight: bold;
        }

        .order-date {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .status-select {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
        }

        .order-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
        }

        .section h3 {
            margin-top: 0;
            font-size: 16px;
        }

        .section p {
            margin: 7px 0;
            line-height: 1.5;
        }

        .items {
            display: grid;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .item:last-child {
            border-bottom: 0;
        }

        .item img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: bold;
        }

        .item-meta {
            color: #666;
            font-size: 13px;
            margin-top: 3px;
        }

        .amount-box {
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
        }

        .payment-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fff2cc;
            color: #8a6200;
        }

        .verified {
            background: #d9f7df;
            color: #1c6b2b;
        }

        .shipping-box {
            display: grid;
            gap: 10px;
        }

        .shipping-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .save-btn {
            margin-top: 10px;
            border: 0;
            background: #111;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 850px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .order-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 550px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>
</head>

<body>

    <header class="topbar">

        <h1>AYONIZA Admin Orders</h1>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <main class="container">

        <div class="stats">

            <div class="stat-card">
                <h3>Total Orders</h3>
                <strong id="totalOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>New Orders</h3>
                <strong id="newOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Shipped</h3>
                <strong id="shippedOrders">0</strong>
            </div>

            <div class="stat-card">
                <h3>Delivered</h3>
                <strong id="deliveredOrders">0</strong>
            </div>

        </div>


        <div id="loading" class="loading">
            Loading orders...
        </div>


        <div
            id="ordersContainer"
            class="orders-wrapper"
        ></div>

    </main>


    <script type="module" src="admin.js"></script>

</body>
</html>
