<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | AYONIZA</title><link rel="stylesheet" href="orders.css"></head>
<body><div class="wrap">
<div class="top"><h1>Orders (admin)</h1><a href="index.html">Website</a></div>
<div id="list"><p class="empty">Loading…</p></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
import { firebaseConfig } from "./firebase-config.js";
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const update = httpsCallable(getFunctions(app, "asia-south1"), "adminUpdateStatus");
const list = document.getElementById("list");
const FLOW = ["PLACED","CONFIRMED","PACKED","SHIPPED","OUT_FOR_DELIVERY","DELIVERED"];
const NEXT_LABEL = { CONFIRMED:"Confirm order", PACKED:"Mark packed", SHIPPED:"Mark shipped", OUT_FOR_DELIVERY:"Out for delivery", DELIVERED:"Mark delivered" };
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };

onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "login.html"; return; }
  onSnapshot(collection(db, "orders"), (snap) => {
    const docs = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    list.innerHTML = "";
    if (!docs.length) list.appendChild(el("p", "No orders yet.", "empty"));
    docs.forEach(o => list.appendChild(card(o)));
  }, () => { list.innerHTML = ""; list.appendChild(el("p", "Access denied. Login with the admin email.", "empty")); });
});

function card(o) {
  const c = el("div", undefined, "card");
  const head = el("div", undefined, "row");
  head.append(el("strong", o.orderId + " · ₹" + o.total), el("span", o.status + " / " + o.paymentStatus + (o.refundStatus ? " / " + o.refundStatus : ""), "badge"));
  const a = o.address;
  c.append(head,
    el("p", o.items.map(i => i.name + " ×" + i.qty).join(", ")),
    el("p", `${a.name}, ${a.mobile} — ${a.address}${a.landmark ? " (" + a.landmark + ")" : ""}, ${a.city}, ${a.state} - ${a.pin}`, "muted"));
  const ci = FLOW.indexOf(o.status);
  if (ci >= 0 && ci < FLOW.length - 1) {
    const next = FLOW[ci + 1], row = el("div", undefined, "row"), inputs = {};
    if (next === "SHIPPED") {
      [["courier","Courier name"],["trackingId","Tracking ID"],["expectedDelivery","Expected delivery date"]].forEach(([k, p]) => {
        const i = el("input"); i.placeholder = p; inputs[k] = i; row.appendChild(i);
      });
    }
    const btn = el("button", NEXT_LABEL[next]);
    btn.onclick = async () => {
      btn.disabled = true;
      try { await update({ orderId: o.orderId, status: next, ...Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()])) }); }
      catch (e) { alert(e.message); btn.disabled = false; }
    };
    row.appendChild(btn);
    if (ci < FLOW.indexOf("SHIPPED")) {
      const cancel = el("button", "Cancel order"); cancel.style.background = "#b3261e";
      cancel.onclick = async () => { if (!confirm("Cancel " + o.orderId + "?")) return; try { await update({ orderId: o.orderId, status: "CANCELLED" }); } catch (e) { alert(e.message); } };
      row.appendChild(cancel);
    }
    c.appendChild(row);
  }
  return c;
}
</script></body></html>
