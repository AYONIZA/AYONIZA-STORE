<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AYONIZA Admin Orders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4f1;
            color: #222;
        }

        .topbar {
            background: #111;
            color: #fff;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .topbar h1 {
            margin: 0;
            font-size: 22px;
        }

        .topbar button {
            border: 0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: min(1400px, 95%);
            margin: 25px auto 60px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #666;
        }

        .stat-card strong {
            font-size: 25px;
        }

        .orders-wrapper {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 14px rgba(0,0,0,.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-id {
            font-size: 18px;
            font-weight: bold;
        }

        .order-date {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .order-status {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 7px;
            background: #f2f2f2;
            font-size: 13px;
            font-weight: bold;
        }

        .order-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
        }

        .section h3 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        .section p {
            margin: 7px 0;
            line-height: 1.5;
        }

        .items {
            display: grid;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .item:last-child {
            border-bottom: 0;
        }

        .item img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: bold;
        }

        .item-meta {
            color: #666;
            font-size: 13px;
            margin-top: 3px;
        }

        .amount-box {
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
        }

        .payment-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fff2cc;
            color: #8a6200;
        }

        .verified {
            background: #d9f7df;
            color: #1c6b2b;
        }

        .shipping-box {
            display: grid;
            gap: 10px;
        }

        .shipping-box input,
        .status-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: #fff;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .accept-btn,
        .cancel-btn,
        .save-btn {
            border: 0;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .accept-btn {
            background: #1f7a3d;
            color: #fff;
        }

        .cancel-btn {
            background: #b42318;
            color: #fff;
        }

        .save-btn {
            background: #111;
            color: #fff;
        }

        .accept-btn:disabled,
        .cancel-btn:disabled,
        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .tracking-link {
            display: inline-block;
            margin-top: 8px;
            word-break: break-all;
            color: #7d2f4e;
        }

        .notification-box {
            margin-top: 15px;
            padding: 12px;
            background: #f8f3f5;
            border-radius: 8px;
            border: 1px solid #eadde2;
        }

        .notification-box strong {
            display: block;
            margin-bottom: 7px;
        }

        .empty,
        .loading {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        /* MODAL */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            width: min(500px, 100%);
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        .modal h2 {
            margin-top: 0;
        }

        .modal label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
        }

        .modal input,
        .modal textarea {
            width: 100%;
            margin-top: 7px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font: inherit;
        }

        .modal textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .modal-close,
        .modal-confirm {
            border: 0;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .modal-close {
            background: #eee;
        }

        .modal-confirm {
            background: #111;
            color: #fff;
        }


        /* =====================================================
           PRODUCT STOCK MANAGEMENT
           ===================================================== */

        .stock-management-section {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin: 25px 0;
            box-shadow: 0 3px 14px rgba(0,0,0,.08);
        }

        .stock-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .stock-section-header h2 {
            margin: 0 0 6px;
            font-size: 21px;
        }

        .stock-section-header p {
            margin: 0;
            color: #666;
            font-size: 13px;
        }

        .stock-products-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .stock-product-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
        }

        .stock-product-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stock-product-image {
            width: 68px;
            height: 68px;
            object-fit: cover;
            border-radius: 9px;
            background: #f5f5f5;
            flex-shrink: 0;
        }

        .stock-product-name {
            margin: 0 0 5px;
            font-size: 15px;
            line-height: 1.35;
        }

        .stock-product-price {
            margin: 0;
            color: #666;
            font-size: 13px;
        }

        .stock-product-stock-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .stock-product-stock-row label {
            font-size: 13px;
            font-weight: 700;
        }

        .stock-input {
            width: 85px;
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        .stock-save-btn {
            border: 0;
            padding: 9px 13px;
            border-radius: 7px;
            cursor: pointer;
            background: #111;
            color: #fff;
            font-weight: 600;
        }

        .stock-save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .stock-current {
            margin-top: 11px;
            font-size: 13px;
            font-weight: 700;
        }

        .stock-current.low {
            color: #b54708;
        }

        .stock-current.out {
            color: #b42318;
        }

        .stock-current.available {
            color: #1c6b2b;
        }

        .stock-admin-message {
            margin-bottom: 15px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f2f7f3;
            color: #1c6b2b;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 850px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .order-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 550px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

    </style>

</head>

<body>

<header class="topbar">

    <h1>
        AYONIZA Admin Orders
    </h1>

    <button id="logoutBtn">
        Logout
    </button>

</header>


<main class="container">

    <div class="stats">

        <div class="stat-card">
            <h3>Total Orders</h3>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat-card">
            <h3>New Orders</h3>
            <strong id="newOrders">0</strong>
        </div>

        <div class="stat-card">
            <h3>Shipped</h3>
            <strong id="shippedOrders">0</strong>
        </div>

        <div class="stat-card">
            <h3>Delivered</h3>
            <strong id="deliveredOrders">0</strong>
        </div>

    </div>


    <div
        id="loading"
        class="loading"
    >
        Loading orders...
    </div>


    <div
        id="ordersContainer"
        class="orders-wrapper"
    ></div>

</main>



    <!-- =====================================================
         PRODUCT STOCK MANAGEMENT
    ====================================================== -->

    <section class="stock-management-section">

        <div class="stock-section-header">

            <div>
                <h2>Product Stock</h2>
                <p>
                    Update product stock directly from the admin panel.
                </p>
            </div>

            <button
                type="button"
                id="syncProductsBtn"
                class="save-btn">
                Sync Products
            </button>

        </div>

        <div
            id="stockMessage"
            class="stock-admin-message"
            hidden>
        </div>

        <div
            id="stockProductsContainer"
            class="stock-products-grid">

            <div class="empty">
                Loading products...
            </div>

        </div>

    </section>


<!-- =====================================================
     ACCEPT ORDER MODAL
====================================================== -->

<div
    class="modal-backdrop"
    id="acceptModal"
>

    <div class="modal">

        <h2>
            Accept Order
        </h2>

        <p id="acceptOrderLabel"></p>

        <label>
            Courier Name

            <input
                type="text"
                id="acceptCourier"
                placeholder="e.g. Shiprocket"
            >
        </label>


        <label>
            Tracking ID

            <input
                type="text"
                id="acceptTracking"
                placeholder="Enter tracking ID"
            >
        </label>


        <div class="modal-actions">

            <button
                type="button"
                class="modal-close"
                id="acceptCloseBtn"
            >
                Back
            </button>

            <button
                type="button"
                class="modal-confirm"
                id="acceptConfirmBtn"
            >
                Confirm Order
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     CANCEL ORDER MODAL
====================================================== -->

<div
    class="modal-backdrop"
    id="cancelModal"
>

    <div class="modal">

        <h2>
            Cancel Order
        </h2>

        <p id="cancelOrderLabel"></p>

        <label>
            Cancellation Reason

            <textarea
                id="cancelReason"
                placeholder="Enter cancellation reason"
            ></textarea>

        </label>


        <div class="modal-actions">

            <button
                type="button"
                class="modal-close"
                id="cancelCloseBtn"
            >
                Back
            </button>

            <button
                type="button"
                class="modal-confirm"
                id="cancelConfirmBtn"
            >
                Cancel Order
            </button>

        </div>

    </div>

</div>


<script
    type="module"
    src="admin.js"
></script>

</body>
</html>
