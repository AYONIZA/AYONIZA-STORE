<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | AYONIZA</title>
<style>
  :root { --bg:#fbf3f4; --card:#fff; --ink:#3a2530; --muted:#8a7480; --accent:#8c3b5a; --line:#ecd9de; --err:#b3261e; --ok:#1e7a46; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font-family:Georgia,"Times New Roman",serif; }
  .box { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px 28px; }
  .brand { display:block; text-align:center; text-decoration:none; color:var(--accent); font-size:26px; letter-spacing:.18em; margin-bottom:4px; }
  .tag { text-align:center; color:var(--muted); font-size:14px; margin:0 0 24px; }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .tab { flex:1; background:none; border:0; padding:10px; font:inherit; font-size:16px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  label { display:block; font-size:14px; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:16px; color:var(--ink); }
  input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .primary { width:100%; margin-top:20px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-size:16px; cursor:pointer; }
  .primary:disabled { opacity:.6; cursor:wait; }
  .google { width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit; font-size:16px; color:var(--ink); cursor:pointer; }
  .or { text-align:center; color:var(--muted); font-size:14px; margin:16px 0; }
  .link { display:block; margin:14px auto 0; background:none; border:0; color:var(--accent); font:inherit; font-size:14px; cursor:pointer; text-decoration:underline; }
  .msg { min-height:20px; margin:14px 0 0; font-size:14px; text-align:center; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .back { display:block; text-align:center; margin-top:18px; color:var(--muted); font-size:14px; text-decoration:none; }
</style>
</head>
<body>
<main class="box">
  <a class="brand" href="index.html">AYONIZA</a>
  <p class="tag">Grace of Sita</p>

  <div class="tabs" role="tablist">
    <button class="tab active" type="button" data-mode="login">Log in</button>
    <button class="tab" type="button" data-mode="signup">Sign up</button>
  </div>

  <button class="google" id="googleBtn" type="button">Continue with Google</button>
  <p class="or">or use your email</p>

  <form id="authForm" novalidate>
    <div id="nameField" hidden>
      <label for="fullname">Full name</label>
      <input id="fullname" name="fullname" type="text" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="submitBtn" type="submit">Log in</button>
  </form>

  <button class="link" id="forgotBtn" type="button">Forgot password?</button>
  <p class="msg" id="authMsg" role="status"></p>
  <a class="back" href="index.html">Back to shop</a>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
