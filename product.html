<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | AYONIZA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>

.pp {
    max-width: 1050px;
    margin: 0 auto;
    padding: 28px 20px 60px;
}

.pp-back {
    display: inline-block;
    margin-bottom: 18px;
    color: inherit;
    text-decoration: none;
    opacity: .75;
    font-size: 15px;
}

.pp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
    align-items: start;
}

.pp-gallery {
    position: relative;
}

.pp-slides {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    border-radius: 14px;
    background: #f6eef0;
}

.pp-slides::-webkit-scrollbar {
    display: none;
}

.pp-slide {
    flex: 0 0 100%;
    scroll-snap-align: center;
    aspect-ratio: 1 / 1;
}

.pp-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.pp-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
}

.pp-prev { left: 10px; }
.pp-next { right: 10px; }

.pp-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}

.pp-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 0;
    padding: 0;
    background: #d8c3ca;
    cursor: pointer;
}

.pp-dot.on {
    background: #8c3b5a;
}

.pp-cat {
    letter-spacing: .14em;
    font-size: 13px;
    opacity: .7;
    margin: 0 0 8px;
}

.pp-name {
    margin: 0 0 12px;
    font-size: 32px;
    line-height: 1.2;
}

.pp-price {
    font-size: 26px;
    margin: 0 0 16px;
}

.pp-desc {
    line-height: 1.7;
    margin: 0 0 24px;
    opacity: .85;
}

.pp-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.pp-actions .add-cart-btn,
.pp-actions .buy-now-btn {
    display: inline-block;
    padding: 13px 26px;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    border: 1px solid #8c3b5a;
}

.pp-actions .add-cart-btn {
    background: #8c3b5a;
    color: #fff;
}

.pp-actions .buy-now-btn {
    background: transparent;
    color: #8c3b5a;
}

.pp-missing {
    text-align: center;
    padding: 80px 20px;
}

@media (max-width: 768px) {

    .pp-grid {
        grid-template-columns: 1fr;
        gap: 22px;
    }

    .pp-name {
        font-size: 26px;
    }

    .pp-actions .add-cart-btn,
    .pp-actions .buy-now-btn {
        flex: 1 1 100%;
    }

}

</style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">
    <a href="index.html#home" class="logo-text" aria-label="AYONIZA Home">
        <span class="logo-brand-name">AYONIZA</span>
        <span class="logo-sub-tag">GRACE OF SITA</span>
    </a>

    <nav id="primaryNav">
        <a href="category.html?cat=all">Shop all</a>
        <a href="category.html?cat=earrings">Earrings</a>
        <a href="category.html?cat=necklaces">Necklaces</a>
        <a href="category.html?cat=sets">Jewellery sets</a>
        <a href="index.html#about">Our story</a>
    </nav>

    <div class="nav-actions">
        <a href="category.html?cat=all" class="nav-icon-btn search-btn" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7.5"/><path d="m20 20-4.2-4.2"/></svg>
        </a>
        <a href="category.html?cat=all" class="nav-icon-btn wishlist-btn" aria-label="Wishlist">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </a>
        <a href="login.html" class="nav-icon-btn user-btn" id="authLink" aria-label="Login / Account" title="Login / Account">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </a>
        <button class="nav-icon-btn cart-icon-btn cart-btn" id="openCartBtn" type="button" aria-label="Open cart">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="cart-badge" id="cartCount">0</span>
        </button>
    </div>
</header>


<!-- ================= PRODUCT ================= -->

<main class="pp" id="productPage"></main>


<!-- ================= CART ================= -->

<div class="cart-overlay" id="cartOverlay"></div>

<aside class="cart-drawer" id="cartDrawer" aria-hidden="true">

    <div class="cart-header">

        <div>
            <p class="small-title">YOUR BAG</p>
            <h3>Shopping Cart</h3>
        </div>

        <button class="close-cart" id="closeCartBtn" type="button" aria-label="Close cart">
            ×
        </button>

    </div>

    <div class="cart-items" id="cartItems">
        <p class="cart-empty" id="cartEmpty">Your bag is empty.</p>
    </div>

    <div class="cart-footer">

        <div class="cart-total-row">
            <span>Subtotal</span>
            <strong id="cartTotal">₹0</strong>
        </div>

        <p class="cart-note">
            Next step: enter your delivery details,
            confirm your order, and complete payment.
        </p>

        <button class="checkout-btn" id="checkoutBtn" type="button">
            Proceed to Checkout
        </button>

        <button class="continue-btn" id="continueShoppingBtn" type="button">
            Continue Shopping
        </button>

    </div>

</aside>


<!-- ================= PRODUCT DATA ================= -->

<script src="products.js"></script>


<!-- ================= PRODUCT PAGE SCRIPT ================= -->

<script>

(function () {

    const q = new URLSearchParams(window.location.search);

    const id    = q.get("id");
    const name  = q.get("name");
    const price = q.get("price");
    const img   = q.get("img");

    const page = document.getElementById("productPage");


    if (!id || !name || !img) {

        page.innerHTML =
            '<div class="pp-missing">' +
            '<h2>Product nahi mila</h2>' +
            '<p><a href="index.html#shop">Shop par wapas jayein</a></p>' +
            '</div>';

        return;

    }


    document.title = name + " | AYONIZA";


    // ---------- ESCAPE HTML ----------

    function esc(s) {
        const d = document.createElement("div");
        d.textContent = s == null ? "" : s;
        return d.innerHTML;
    }

    function attr(s) {
        return esc(s).replace(/"/g, "&quot;");
    }


    const shown = q.get("ptxt") || (price ? "₹" + price : "");


    // ---------- PRODUCT HTML ----------

    page.innerHTML =

        '<a class="pp-back" href="index.html#shop">← Back to shop</a>' +

        '<div class="pp-grid">' +

            '<div class="pp-gallery">' +
                '<div class="pp-slides" id="ppSlides"></div>' +
                '<button class="pp-arrow pp-prev" id="ppPrev" type="button" aria-label="Previous image">‹</button>' +
                '<button class="pp-arrow pp-next" id="ppNext" type="button" aria-label="Next image">›</button>' +
                '<div class="pp-dots" id="ppDots"></div>' +
            '</div>' +

            '<div>' +

                '<p class="pp-cat">' + esc(q.get("cat") || "") + '</p>' +
                '<h1 class="pp-name">' + esc(name) + '</h1>' +
                '<p class="pp-price">' + esc(shown) + '</p>' +
                '<p class="pp-desc">' + esc(q.get("desc") || "") + '</p>' +

                '<div class="pp-actions">' +

                    '<button class="add-cart-btn" type="button"' +
                    ' data-id="' + attr(id) + '"' +
                    ' data-name="' + attr(name) + '"' +
                    ' data-price="' + attr(price) + '"' +
                    ' data-image="' + attr(img) + '">' +
                    'Add to Cart</button>' +

                    '<button class="buy-now-btn" id="productBuyNowBtn" type="button"' +
                    ' data-id="' + attr(id) + '"' +
                    ' data-name="' + attr(name) + '"' +
                    ' data-price="' + attr(price) + '"' +
                    ' data-image="' + attr(img) + '">' +
                    'Buy Now</button>' +

                '</div>' +

            '</div>' +

        '</div>';


    // ---------- IMAGE SLIDER ----------

    let list = [img].concat((window.GALLERY && window.GALLERY[id]) || []);

    list = list
        .filter(function (s, i) {
            return s && list.indexOf(s) === i;
        })
        .slice(0, 5);


    const track = document.getElementById("ppSlides");
    const dots  = document.getElementById("ppDots");
    const prev  = document.getElementById("ppPrev");
    const next  = document.getElementById("ppNext");


    function build() {

        track.innerHTML = "";
        dots.innerHTML = "";

        list.forEach(function (src, i) {

            const slide = document.createElement("div");
            slide.className = "pp-slide";

            const im = document.createElement("img");
            im.src = src;
            im.alt = name + " - image " + (i + 1);

            im.onerror = function () {
                const k = list.indexOf(src);
                if (k > -1 && list.length > 1) {
                    list.splice(k, 1);
                    build();
                }
            };

            slide.appendChild(im);
            track.appendChild(slide);

            const d = document.createElement("button");
            d.type = "button";
            d.className = "pp-dot" + (i === 0 ? " on" : "");
            d.setAttribute("aria-label", "Image " + (i + 1));

            d.onclick = function () {
                track.scrollTo({
                    left: i * track.clientWidth,
                    behavior: "smooth"
                });
            };

            dots.appendChild(d);

        });

        const many = list.length > 1;

        prev.style.display = many ? "" : "none";
        next.style.display = many ? "" : "none";
        dots.style.display = many ? "" : "none";

    }


    track.addEventListener("scroll", function () {

        const i = Math.round(track.scrollLeft / (track.clientWidth || 1));

        Array.prototype.forEach.call(dots.children, function (d, k) {
            d.classList.toggle("on", k === i);
        });

    });


    prev.onclick = function () {
        track.scrollBy({ left: -track.clientWidth, behavior: "smooth" });
    };

    next.onclick = function () {
        track.scrollBy({ left: track.clientWidth, behavior: "smooth" });
    };


    document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft")  prev.click();
        if (e.key === "ArrowRight") next.click();
    });


    build();


    // ---------- CART HELPERS ----------

    const CART_KEY = "ayonizaCart";

    function readCart() {
        try {
            const c = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
            return Array.isArray(c) ? c : [];
        } catch (e) {
            return [];
        }
    }

    function addToCart() {

        const cart = readCart();

        const existing = cart.find(function (item) {
            return String(item.id) === String(id);
        });

        if (existing) {
            existing.qty = (Number(existing.qty) || 0) + 1;
        } else {
            cart.push({
                id: id,
                name: name,
                price: Number(price) || 0,
                image: img,
                qty: 1
            });
        }

        localStorage.setItem(CART_KEY, JSON.stringify(cart));

        const count = cart.reduce(function (n, item) {
            return n + (Number(item.qty) || 0);
        }, 0);

        const badge = document.getElementById("cartCount");
        if (badge) badge.textContent = count;

        window.dispatchEvent(new Event("ayonizaCartUpdated"));

    }


    // ---------- ADD TO CART BUTTON ----------
    // capture + stopImmediatePropagation: script.js ka handler
    // dobara add na kare (double quantity na ho)

    document.addEventListener("click", function (e) {

        const btn = e.target.closest(".pp-actions .add-cart-btn");
        if (!btn) return;

        e.preventDefault();
        e.stopImmediatePropagation();

        addToCart();

        const old = btn.textContent;
        btn.textContent = "Added ✓";

        setTimeout(function () {
            btn.textContent = old;
        }, 1200);

    }, true);


    // ---------- BUY NOW BUTTON ----------

    const buyNowBtn = document.getElementById("productBuyNowBtn");

    if (buyNowBtn) {
        buyNowBtn.addEventListener("click", function () {
            addToCart();
            localStorage.setItem("ayonizaOpenCart", "1");
            window.location.href = "index.html";
        });
    }

})();

</script>


<!-- ================= MAIN WEBSITE SCRIPT ================= -->

<script type="module" src="script.js"></script>

<script type="module" src="auth.js"></script>


</body>
</html>
