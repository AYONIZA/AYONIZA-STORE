<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account | AYONIZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --maroon: #3d1221;
      --maroon-soft: #6b3a4a;
      --cream: #faf7f2;
      --card: #ffffff;
      --line: #e6dfd6;
      --text: #2b1b21;
      --muted: #7a6a70;
      --ok: #2e7d4f;
      --err: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: "Jost", sans-serif;
      line-height: 1.5;
    }

    /* ---- Top bar (apni site ka header yahan paste kar sakte ho) ---- */
    .topbar {
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--maroon);
      text-decoration: none;
    }
    .topbar a.back { color: var(--maroon-soft); text-decoration: none; font-size: 15px; }

    /* ---- Layout ---- */
    .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 36px;
      color: var(--maroon);
      margin: 0 0 4px;
    }
    .sub { color: var(--muted); margin: 0 0 28px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      color: var(--maroon);
      margin: 0 0 16px;
    }

    /* ---- Forms ---- */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid var(--maroon-soft); outline-offset: 1px; }
    input[readonly] { background: #f4f0ea; color: var(--muted); }
    .check { display: flex; align-items: center; gap: 8px; }
    .check input { width: auto; }
    .check label { margin: 0; color: var(--text); }

    .btn {
      font: inherit;
      cursor: pointer;
      border-radius: 999px;
      padding: 11px 26px;
      border: 1px solid var(--maroon);
      background: var(--maroon);
      color: #fff;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--maroon); }
    .btn.small { padding: 6px 16px; font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

    .msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }

    /* ---- Address cards ---- */
    .addr-list { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; }
    .addr {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: #fffdfa;
    }
    .addr.default { border-color: var(--maroon-soft); }
    .addr .tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #f1e6ea;
      color: var(--maroon);
      margin-right: 6px;
    }
    .addr p { margin: 6px 0; font-size: 15px; }
    .addr .name { font-weight: 500; }
    .empty { color: var(--muted); margin: 0 0 12px; }

    .loading { text-align: center; padding: 80px 0; color: var(--muted); }

    @media (max-width: 640px) {
      .grid, .addr-list { grid-template-columns: 1fr; }
      h1 { font-size: 30px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html">AYONIZA</a>
    <a class="back" href="index.html">&larr; Continue shopping</a>
  </header>

  <main class="wrap">
    <div id="loading" class="loading">Loading your account...</div>

    <div id="content" hidden>
      <h1>My Account</h1>
      <p class="sub" id="welcome"></p>

      <!-- ================= PROFILE ================= -->
      <section class="card">
        <h2>Personal details</h2>
        <form id="profileForm" novalidate>
          <div class="grid">
            <div>
              <label for="pName">Full name *</label>
              <input id="pName" type="text" maxlength="80" autocomplete="name" required>
            </div>
            <div>
              <label for="pPhone">Mobile number *</label>
              <input id="pPhone" type="tel" inputmode="numeric" maxlength="15" placeholder="10-digit mobile number" autocomplete="tel">
            </div>
            <div class="full">
              <label for="pEmail">Email</label>
              <input id="pEmail" type="email" readonly>
            </div>
          </div>
          <div class="actions">
            <button class="btn" id="profileBtn" type="submit">Save details</button>
          </div>
          <div class="msg" id="profileMsg"></div>
        </form>
      </section>

      <!-- ================= ADDRESSES ================= -->
      <section class="card">
        <h2>Saved addresses</h2>
        <div id="addrList" class="addr-list"></div>
        <p id="addrEmpty" class="empty" hidden>No address saved yet. Add one to order faster.</p>
        <button class="btn ghost" id="addAddrBtn" type="button">+ Add new address</button>
        <div class="msg" id="addrMsg"></div>

        <form id="addrForm" novalidate hidden style="margin-top:20px">
          <h2 id="addrFormTitle" style="font-size:22px">New address</h2>
          <div class="grid">
            <div>
              <label for="aName">Receiver's full name *</label>
              <input id="aName" type="text" maxlength="80" autocomplete="name">
            </div>
            <div>
              <label for="aPhone">Mobile number *</label>
              <input id="aPhone" type="tel" inputmode="numeric" maxlength="15" autocomplete="tel">
            </div>
            <div class="full">
              <label for="aLine1">House / Flat / Street *</label>
              <input id="aLine1" type="text" maxlength="150" autocomplete="address-line1">
            </div>
            <div class="full">
              <label for="aLine2">Area / Landmark (optional)</label>
              <input id="aLine2" type="text" maxlength="150" autocomplete="address-line2">
            </div>
            <div>
              <label for="aCity">City *</label>
              <input id="aCity" type="text" maxlength="60" autocomplete="address-level2">
            </div>
            <div>
              <label for="aState">State *</label>
              <select id="aState"></select>
            </div>
            <div>
              <label for="aPin">Pincode *</label>
              <input id="aPin" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit pincode" autocomplete="postal-code">
            </div>
            <div>
              <label for="aType">Address type</label>
              <select id="aType">
                <option value="Home">Home</option>
                <option value="Work">Work</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="full check">
              <input id="aDefault" type="checkbox">
              <label for="aDefault">Make this my default address</label>
            </div>
          </div>
          <div class="actions">
            <button class="btn" id="addrSaveBtn" type="submit">Save address</button>
            <button class="btn ghost" id="addrCancelBtn" type="button">Cancel</button>
          </div>
          <div class="msg" id="addrFormMsg"></div>
        </form>
      </section>

      <div class="actions">
        <button class="btn ghost" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./auth.js";

    import {
      onAuthStateChanged,
      updateProfile,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      doc,
      getDoc,
      setDoc,
      collection,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* ================= HELPERS ================= */

    const $ = (id) => document.getElementById(id);

    const MAX_ADDRESSES = 5;

    const STATES = [
      "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh",
      "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka",
      "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram",
      "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu",
      "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal",
      "Andaman and Nicobar Islands", "Chandigarh",
      "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Jammu and Kashmir",
      "Ladakh", "Lakshadweep", "Puducherry"
    ];

    // State dropdown
    const stateSelect = $("aState");
    stateSelect.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select state";
    stateSelect.appendChild(placeholder);
    STATES.forEach((s) => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      stateSelect.appendChild(opt);
    });

    function setMsg(el, text, ok = false) {
      el.textContent = text;
      el.className = "msg " + (text ? (ok ? "ok" : "err") : "");
    }

    // +91 / spaces / dashes hata kar 10 digit number nikalta hai
    function cleanPhone(value) {
      let digits = String(value || "").replace(/\D/g, "");
      if (digits.length === 12 && digits.startsWith("91")) digits = digits.slice(2);
      if (digits.length === 11 && digits.startsWith("0")) digits = digits.slice(1);
      return digits;
    }

    const isValidPhone = (p) => /^[6-9]\d{9}$/.test(p);
    const isValidPin = (p) => /^[1-9]\d{5}$/.test(p);


    /* ================= STATE ================= */

    let currentUser = null;
    let editingId = null;
    let addresses = [];


    /* ================= PROFILE ================= */

    // users/{uid} document nahi hai to rules ke hisaab se create karo
    async function ensureProfile(user) {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);

      if (snap.exists()) return snap.data();

      const data = {
        uid: user.uid,
        fullName: user.displayName || "",
        email: user.email || "",
        phone: "",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };

      await setDoc(ref, data);
      return { fullName: data.fullName, email: data.email, phone: "" };
    }

    async function loadProfile(user) {
      const data = await ensureProfile(user);

      $("pName").value = data.fullName || user.displayName || "";
      $("pPhone").value = data.phone || "";
      $("pEmail").value = user.email || data.email || "";

      const first = ($("pName").value || user.email || "").split(" ")[0].split("@")[0];
      $("welcome").textContent = first ? "Hello, " + first + "!" : "";
    }

    $("profileForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const msg = $("profileMsg");
      const fullName = $("pName").value.trim();
      const phone = cleanPhone($("pPhone").value);

      if (!fullName) return setMsg(msg, "Please enter your full name.");
      if (!isValidPhone(phone)) return setMsg(msg, "Please enter a valid 10-digit mobile number.");

      $("profileBtn").disabled = true;

      try {
        // Rules: update me sirf fullName, phone, updatedAt allowed hain
        await setDoc(
          doc(db, "users", currentUser.uid),
          { fullName, phone, updatedAt: serverTimestamp() },
          { merge: true }
        );

        if (currentUser.displayName !== fullName) {
          await updateProfile(currentUser, { displayName: fullName });
        }

        $("pPhone").value = phone;
        setMsg(msg, "Details saved.", true);
      } catch (error) {
        console.error("Profile save error:", error);
        setMsg(msg, "Could not save your details. Please try again.");
      } finally {
        $("profileBtn").disabled = false;
      }
    });


    /* ================= ADDRESSES ================= */

    const addrCol = () => collection(db, "users", currentUser.uid, "addresses");

    async function loadAddresses() {
      const snap = await getDocs(addrCol());

      addresses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

      // Default pehle, phir naye pehle
      addresses.sort((a, b) => {
        if (!!b.isDefault !== !!a.isDefault) return b.isDefault ? 1 : -1;
        const ta = a.createdAt?.seconds || 0;
        const tb = b.createdAt?.seconds || 0;
        return tb - ta;
      });

      renderAddresses();
    }

    function makeButton(text, onClick, extraClass = "") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn ghost small " + extraClass;
      btn.textContent = text;
      btn.addEventListener("click", onClick);
      return btn;
    }

    function renderAddresses() {
      const list = $("addrList");
      list.innerHTML = "";

      $("addrEmpty").hidden = addresses.length > 0;
      $("addAddrBtn").hidden = addresses.length >= MAX_ADDRESSES;

      addresses.forEach((a) => {
        const card = document.createElement("div");
        card.className = "addr" + (a.isDefault ? " default" : "");

        const tags = document.createElement("div");
        const typeTag = document.createElement("span");
        typeTag.className = "tag";
        typeTag.textContent = a.type || "Home";
        tags.appendChild(typeTag);

        if (a.isDefault) {
          const defTag = document.createElement("span");
          defTag.className = "tag";
          defTag.textContent = "Default";
          tags.appendChild(defTag);
        }
        card.appendChild(tags);

        const name = document.createElement("p");
        name.className = "name";
        name.textContent = a.fullName || "";
        card.appendChild(name);

        const lines = document.createElement("p");
        lines.textContent = [a.line1, a.line2].filter(Boolean).join(", ");
        card.appendChild(lines);

        const place = document.createElement("p");
        place.textContent = [a.city, a.state].filter(Boolean).join(", ") + " - " + (a.pincode || "");
        card.appendChild(place);

        const phone = document.createElement("p");
        phone.textContent = "Mobile: " + (a.phone || "");
        card.appendChild(phone);

        const actions = document.createElement("div");
        actions.className = "actions";
        actions.style.marginTop = "12px";

        actions.appendChild(makeButton("Edit", () => openAddressForm(a)));
        if (!a.isDefault) {
          actions.appendChild(makeButton("Set default", () => setDefault(a.id)));
        }
        actions.appendChild(makeButton("Delete", () => deleteAddress(a)));

        card.appendChild(actions);
        list.appendChild(card);
      });
    }

    function openAddressForm(address = null) {
      editingId = address ? address.id : null;

      $("addrFormTitle").textContent = address ? "Edit address" : "New address";
      $("aName").value = address?.fullName || $("pName").value || "";
      $("aPhone").value = address?.phone || $("pPhone").value || "";
      $("aLine1").value = address?.line1 || "";
      $("aLine2").value = address?.line2 || "";
      $("aCity").value = address?.city || "";
      $("aState").value = address?.state || "";
      $("aPin").value = address?.pincode || "";
      $("aType").value = address?.type || "Home";
      $("aDefault").checked = address ? !!address.isDefault : addresses.length === 0;

      setMsg($("addrFormMsg"), "");
      $("addrForm").hidden = false;
      $("aName").focus();
    }

    function closeAddressForm() {
      editingId = null;
      $("addrForm").hidden = true;
      setMsg($("addrFormMsg"), "");
    }

    $("addAddrBtn").addEventListener("click", () => {
      if (addresses.length >= MAX_ADDRESSES) {
        return setMsg($("addrMsg"), "You can save up to " + MAX_ADDRESSES + " addresses.");
      }
      setMsg($("addrMsg"), "");
      openAddressForm();
    });

    $("addrCancelBtn").addEventListener("click", closeAddressForm);

    // Doosre addresses se default hatao
    async function clearOtherDefaults(exceptId) {
      const others = addresses.filter((a) => a.isDefault && a.id !== exceptId);
      for (const a of others) {
        await updateDoc(doc(db, "users", currentUser.uid, "addresses", a.id), {
          isDefault: false
        });
      }
    }

    async function setDefault(id) {
      try {
        await clearOtherDefaults(id);
        await updateDoc(doc(db, "users", currentUser.uid, "addresses", id), {
          isDefault: true
        });
        await loadAddresses();
        setMsg($("addrMsg"), "Default address updated.", true);
      } catch (error) {
        console.error("Set default error:", error);
        setMsg($("addrMsg"), "Could not update default address.");
      }
    }

    async function deleteAddress(address) {
      if (!confirm("Delete this address?")) return;

      try {
        await deleteDoc(doc(db, "users", currentUser.uid, "addresses", address.id));

        // Default delete hua to bacha hua pehla address default bana do
        if (address.isDefault) {
          const next = addresses.find((a) => a.id !== address.id);
          if (next) {
            await updateDoc(doc(db, "users", currentUser.uid, "addresses", next.id), {
              isDefault: true
            });
          }
        }

        if (editingId === address.id) closeAddressForm();

        await loadAddresses();
        setMsg($("addrMsg"), "Address deleted.", true);
      } catch (error) {
        console.error("Delete address error:", error);
        setMsg($("addrMsg"), "Could not delete the address. Please try again.");
      }
    }

    $("addrForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const msg = $("addrFormMsg");

      const data = {
        fullName: $("aName").value.trim(),
        phone: cleanPhone($("aPhone").value),
        line1: $("aLine1").value.trim(),
        line2: $("aLine2").value.trim(),
        city: $("aCity").value.trim(),
        state: $("aState").value,
        pincode: $("aPin").value.trim(),
        type: $("aType").value,
        isDefault: $("aDefault").checked
      };

      if (!data.fullName) return setMsg(msg, "Please enter the receiver's name.");
      if (!isValidPhone(data.phone)) return setMsg(msg, "Please enter a valid 10-digit mobile number.");
      if (!data.line1) return setMsg(msg, "Please enter house / flat / street.");
      if (!data.city) return setMsg(msg, "Please enter your city.");
      if (!data.state) return setMsg(msg, "Please select your state.");
      if (!isValidPin(data.pincode)) return setMsg(msg, "Please enter a valid 6-digit pincode.");

      // Pehla address hamesha default
      if (addresses.length === 0 || (addresses.length === 1 && editingId)) {
        data.isDefault = true;
      }

      $("addrSaveBtn").disabled = true;

      try {
        if (data.isDefault) await clearOtherDefaults(editingId);

        if (editingId) {
          await updateDoc(doc(db, "users", currentUser.uid, "addresses", editingId), {
            ...data,
            updatedAt: serverTimestamp()
          });
        } else {
          await addDoc(addrCol(), {
            ...data,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }

        closeAddressForm();
        await loadAddresses();
        setMsg($("addrMsg"), "Address saved.", true);
      } catch (error) {
        console.error("Address save error:", error);
        setMsg(msg, "Could not save the address. Please try again.");
      } finally {
        $("addrSaveBtn").disabled = false;
      }
    });


    /* ================= LOGOUT ================= */

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "index.html";
      } catch (error) {
        console.error("Logout error:", error);
      }
    });


    /* ================= START ================= */

    onAuthStateChanged(auth, async (user) => {
      // Login nahi hai to login page par bhejo
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      try {
        await loadProfile(user);
        await loadAddresses();
      } catch (error) {
        console.error("Account load error:", error);
        $("welcome").textContent = "Could not load some of your details. Please refresh the page.";
      }

      $("loading").hidden = true;
      $("content").hidden = false;
    });
  </script>
</body>
</html>
