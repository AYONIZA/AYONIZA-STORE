<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Account | AYONIZA</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .account-page {
            min-height: 80vh;
            padding: 70px 6%;
        }

        .account-container {
            max-width: 900px;
            margin: auto;
            background: var(--white);
            border: 1px solid var(--border);
            padding: 45px;
        }

        .account-container h1 {
            font-size: 55px;
            color: var(--dark-gold);
            margin-bottom: 10px;
        }

        .account-subtitle {
            color: var(--gray);
            margin-bottom: 35px;
        }

        .account-form {
            display: grid;
            gap: 18px;
        }

        .account-form label {
            display: block;
            font-size: 13px;
            color: var(--black);
        }

        .account-form input {
            width: 100%;
            margin-top: 7px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            background: #fff;
        }

        .account-form input:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
        }

        .account-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .account-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .account-message {
            min-height: 22px;
            font-size: 13px;
            color: var(--dark-gold);
        }

        .logout-btn {
            border: 1px solid #8c3b5a;
            background: transparent;
            color: #8c3b5a;
            padding: 12px 22px;
            cursor: pointer;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: #8c3b5a;
            color: white;
        }

        @media (max-width: 650px) {

            .account-page {
                padding: 40px 5%;
            }

            .account-container {
                padding: 28px 20px;
            }

            .account-container h1 {
                font-size: 42px;
            }

            .account-row {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<header class="navbar">

    <a href="index.html" class="logo-text">
        AYONIZA
    </a>

    <div class="nav-actions">

        <a href="index.html"
           class="instagram-btn">
            Back to Shop
        </a>

    </div>

</header>


<main class="account-page">

    <div class="account-container">

        <p class="small-title">
            AYONIZA ACCOUNT
        </p>

        <h1>
            My Account
        </h1>

        <p class="account-subtitle">
            Save your delivery details for faster checkout.
        </p>


        <form class="account-form"
              id="accountForm">

            <label>
                Full Name

                <input
                    type="text"
                    id="fullName"
                    required
                    autocomplete="name">
            </label>


            <label>
                Email Address

                <input
                    type="email"
                    id="email"
                    readonly>
            </label>


            <label>
                Mobile Number

                <input
                    type="tel"
                    id="phone"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="10-digit mobile number"
                    autocomplete="tel">
            </label>


            <label>
                Address

                <input
                    type="text"
                    id="address"
                    placeholder="House no., street, area"
                    autocomplete="street-address">
            </label>


            <label>
                Landmark

                <input
                    type="text"
                    id="landmark"
                    placeholder="Optional">
            </label>


            <div class="account-row">

                <label>
                    City

                    <input
                        type="text"
                        id="city"
                        autocomplete="address-level2">
                </label>


                <label>
                    State

                    <input
                        type="text"
                        id="state"
                        autocomplete="address-level1">
                </label>

            </div>


            <div class="account-row">

                <label>
                    PIN Code

                    <input
                        type="text"
                        id="pincode"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="postal-code">
                </label>


                <label>
                    Country

                    <input
                        type="text"
                        id="country"
                        value="India"
                        autocomplete="country-name">
                </label>

            </div>


            <p class="account-message"
               id="accountMessage"></p>


            <div class="account-actions">

                <button
                    type="submit"
                    class="btn primary">
                    Save Profile
                </button>


                <button
                    type="button"
                    class="logout-btn"
                    id="logoutBtn">
                    Logout
                </button>

            </div>

        </form>

    </div>

</main>


<footer class="site-footer">

    <p class="footer-bottom">
        © 2026 AYONIZA. All rights reserved.
    </p>

</footer>


<script type="module"
        src="account.js"></script>

</body>

</html>
