<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AYONIZA — Grace of Sita</title>
  <script>
    // GitHub Pages Clean URL Router
    (function () {
      var path = window.location.pathname;
      var clean = path.replace(/^\/+|\/+$/g, '');
      var search = window.location.search;
      var hash = window.location.hash;

      if (!clean || clean === 'index' || clean === 'index.html') {
        window.location.replace('/' + search + hash);
        return;
      }

      // If URL does not have an extension, try appending .html
      if (!clean.includes('.')) {
        window.location.replace('/' + clean + '.html' + search + hash);
        return;
      }

      // Fallback to home
      window.location.replace('/' + search + hash);
    })();
  </script>
</head>
<body>
</body>
</html>
